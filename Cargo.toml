[package]
name = "patisson-bybit-sdk"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
authors = ["Yurii Musolov <yurii.musolov@gmail.com>"]
description = "Unofficial Rust SDK for the Bybit exchange API"
keywords = ["bybit", "sdk", "crypto", "trading", "cryptocurrency"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]
documentation = "https://docs.rs/crate/patisson-bybit-sdk"
repository = "https://github.com/yurii-musolov/patisson-bybit-sdk"
license = "MIT"
readme = "README.md"
include = [
  "/src/**/*",
  "/examples/**/*",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE",
]

[lib]
name = "bybit"
path = "src/lib.rs"

[features]
default = ["rustls"]
# TLS backend for REST and WebSocket; enable exactly one.
# rustls with aws-lc-rs and the operating system's root certificates.
rustls = ["reqwest/rustls", "tokio-tungstenite/rustls-tls-native-roots"]
# The platform TLS library (OpenSSL, Schannel, Security.framework).
native-tls = ["reqwest/native-tls", "tokio-tungstenite/native-tls"]

[dependencies]
futures-util = { version = "0.3.32", default-features = false, features = [
  "sink",
  "std",
] }
hex = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.4", default-features = false, features = [
  "charset",
  "http2",
  "json",
  "query",
  "system-proxy",
] }
rust_decimal = { version = "1.42.1", features = [
  "std",
  "macros",
  "serde-str",
  "serde-with-str",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_path_to_error = "0.1.20"
serde_repr = "0.1.20"
serde_urlencoded = "0.7.1"
serde-aux = "4.7"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = "0.29.0"
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
anyhow = "1.0.103"
tokio = { version = "1.52.3", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
